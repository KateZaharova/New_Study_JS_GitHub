    <h2>Lets make a scroll button!</h2>

    <button class="scroll-up-btn" 
                style="all:unset;
                position: fixed;
                bottom: 25px;
                right: 30px;
                height:90px;
                width: 90px;
                background-color: #080808;
                border-radius: 99%;
                display:flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;">
        <i class="arrow-up" 
                style="width:28px;
                height:28px;
                border-left: 4px solid #f9f9f9;
                border-bottom: 4px solid #f9f9f9;
                transform: rotate(135deg);
                margin-bottom: -14px;
                pointer-events: none;">
        </i>
    </button>

    <button class="scroll-down-btn" 
                style="all:unset;
                    position: fixed;
                    top: 5px;
                    right: 30px;
                    height:90px;
                    width: 90px;
                    background-color: yellowgreen;
                    border-radius: 99%;
                    display:flex;
                    align-items: center;
                    justify-content: center;
                    cursor: pointer;">
        <i class="arrow-down" 
                style="width:28px;
                    height:28px;
                    border-left: 4px solid #f9f9f9;
                    border-bottom: 4px solid #f9f9f9;
                    transform: rotate(-45deg);
                    margin-bottom: 20px;
                    pointer-events: none;">
        </i>
    </button>
